version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: task-assistant-db
    environment:
      POSTGRES_DB: taskassistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskassistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: task-assistant-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taskassistant
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
